[package]
name = "rust-chat"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "rust-chat"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
